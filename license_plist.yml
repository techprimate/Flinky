options:
  packagePaths:
    - Flinky.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  outputPath: Targets/App/Sources/Resources/Settings.bundle
  prefix: Licenses
  addVersionNumbers: true
  suppressOpeningDirectory: true
  failIfMissingLicense: true
exclude:
  # Both Sentry packages currently use the same MIT license text.
  - owner: getsentry
    name: sentry-apple-swift-log
rename:
  sentry-cocoa: Sentry and SentrySwiftLog
